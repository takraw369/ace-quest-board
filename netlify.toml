# RETIREMENT GUARD
# Netlify is no longer the deployment target for this repository.
# Exit code 0 tells Netlify to skip Git-triggered builds.
# Keep this guard until the Netlify project is stopped/disabled in the Netlify UI.

[build]
  ignore = "exit 0"
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "20"
